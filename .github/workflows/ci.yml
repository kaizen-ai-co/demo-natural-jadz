name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Check y capturas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Formato
        run: npm run format:check
      - name: Tipos, lint, contraste, licencias, build y enlaces
        run: npm run check
      - name: Capturas 390 px y 1440 px
        run: |
          npx playwright install --with-deps chromium
          npm run shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: screenshots/
          if-no-files-found: ignore
